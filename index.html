<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PWR, BWR, VVER, RBMK ve CANDU reaktörlerini animasyonlu teknik şemalarla anlatan Türkçe eğitim uygulaması" />
    <title>Reaktör Şemaları — PWR, BWR, VVER, RBMK, CANDU</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15.3' fill='%23ffcc00' stroke='%231a1a1a' stroke-width='1.2'/%3E%3Cg fill='%231a1a1a'%3E%3Cpath d='M18.15 19.72L22.25 26.83A12.5 12.5 0 0 1 9.75 26.83L13.85 19.72A4.3 4.3 0 0 0 18.15 19.72Z'/%3E%3Cpath d='M11.7 16L3.5 16A12.5 12.5 0 0 1 9.75 5.17L13.85 12.28A4.3 4.3 0 0 0 11.7 16Z'/%3E%3Cpath d='M18.15 12.28L22.25 5.17A12.5 12.5 0 0 1 28.5 16L20.3 16A4.3 4.3 0 0 0 18.15 12.28Z'/%3E%3Ccircle cx='16' cy='16' r='2.8'/%3E%3C/g%3E%3C/svg%3E" />
    <script>
      // İlk çizimden önce görünüm tercihini uygula (src/app/viewPreference.ts ile aynı mantık).
      (function () {
        var pref = 'auto';
        try {
          var v = window.localStorage.getItem('reaktor-semalari:view-preference:v1');
          if (v === 'auto' || v === 'mobile' || v === 'desktop') pref = v;
        } catch (e) {}
        var w = window.innerWidth || document.documentElement.clientWidth || 1440;
        var layout = pref === 'mobile' ? 'narrow' : pref === 'desktop' ? 'wide' : w < 768 ? 'narrow' : w < 1200 ? 'medium' : 'wide';
        document.documentElement.setAttribute('data-view-preference', pref);
        document.documentElement.setAttribute('data-layout', layout);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
